# Canonical → TR-181 device info mappings.
#
# Same canonical paths as device-info-tr098, mapped to Device.* tree.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: device-info-tr181
spec:
  mappings:
    - canonical: canonical.device.manufacturer
      valueType: string
      devicePath: Device.DeviceInfo.Manufacturer
    - canonical: canonical.device.manufacturer_oui
      valueType: string
      devicePath: Device.DeviceInfo.ManufacturerOUI
    - canonical: canonical.device.product_class
      valueType: string
      devicePath: Device.DeviceInfo.ProductClass
    - canonical: canonical.device.serial_number
      valueType: string
      devicePath: Device.DeviceInfo.SerialNumber
    - canonical: canonical.device.hardware_version
      valueType: string
      devicePath: Device.DeviceInfo.HardwareVersion
    - canonical: canonical.device.software_version
      valueType: string
      devicePath: Device.DeviceInfo.SoftwareVersion
    - canonical: canonical.device.model_name
      valueType: string
      devicePath: Device.DeviceInfo.ModelName
    - canonical: canonical.device.description
      valueType: string
      devicePath: Device.DeviceInfo.Description
    - canonical: canonical.device.uptime
      valueType: unsignedint
      devicePath: Device.DeviceInfo.UpTime
    - canonical: canonical.device.spec_version
      valueType: string
      devicePath: Device.DeviceInfo.SpecVersion
---
# Canonical → TR-181 management server mappings.
#
# Same canonical paths as mgmt-tr098, mapped to Device.* tree.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: mgmt-tr181
spec:
  mappings:
    - canonical: canonical.mgmt.connection_request_url
      valueType: string
      devicePath: Device.ManagementServer.ConnectionRequestURL
    - canonical: canonical.mgmt.connection_request_username
      valueType: string
      devicePath: Device.ManagementServer.ConnectionRequestUsername
    - canonical: canonical.mgmt.connection_request_password
      valueType: string
      devicePath: Device.ManagementServer.ConnectionRequestPassword
    - canonical: canonical.mgmt.username
      valueType: string
      devicePath: Device.ManagementServer.Username
    - canonical: canonical.mgmt.password
      valueType: string
      devicePath: Device.ManagementServer.Password
    - canonical: canonical.mgmt.periodic_inform_enable
      valueType: boolean
      devicePath: Device.ManagementServer.PeriodicInformEnable
    - canonical: canonical.mgmt.periodic_inform_interval
      valueType: unsignedint
      devicePath: Device.ManagementServer.PeriodicInformInterval
    - canonical: canonical.mgmt.periodic_inform_time
      valueType: datetime
      devicePath: Device.ManagementServer.PeriodicInformTime
    - canonical: canonical.mgmt.url
      valueType: string
      devicePath: Device.ManagementServer.URL
    - canonical: canonical.mgmt.parameter_key
      valueType: string
      devicePath: Device.ManagementServer.ParameterKey
    - canonical: canonical.mgmt.provisioning_code
      valueType: string
      devicePath: Device.DeviceInfo.ProvisioningCode
---
# Baseline fallback mapping profile for any TR-181 device, over CWMP or
# USP. Mirror of baseline-tr098 for the `Device.*` root; see that profile
# for why a data-model-wide fallback is required rather than optional.
#
# Carries device-info only. `Device.DeviceInfo.*` is part of the data
# model on both protocols, so this is safe for every TR-181 device.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: baseline-tr181
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
  parameterMappings:
    - device-info-tr181
    - firmware-tr181
    - wifi-tr181
---
# CWMP-only half of the TR-181 baseline: the `canonical.mgmt.*` table.
#
# `Device.ManagementServer.*` is the TR-069 CPE WAN Management Protocol
# object. A TR-369 agent runs the same TR-181 data model but has no
# ManagementServer at all (its controller relationship lives under
# `Device.LocalAgent.*` and its transport under `Device.MQTT.*`), so
# binding this table to a USP device produces canonicals that resolve to
# paths the agent will reject: obuspa answers err 7026
# "Path (Device.ManagementServer) does not exist in the schema".
#
# Scoping it with `protocol:cwmp` (#569) means a rule targeting
# `canonical.mgmt.*` on a USP device now fails with a clear
# canonical_unmapped instead of a confusing schema error from the agent
# — the rule is what is wrong, and the error should say so.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingProfile
metadata:
  name: baseline-tr181-cwmp
spec:
  priority: 10
  deviceSelector:
    matchExpressions:
      - key: "dataModel:device"
        operator: Exists
      - key: "protocol:cwmp"
        operator: Exists
  parameterMappings:
    - device-info-tr181
    - firmware-tr181
    - mgmt-tr181
    - wifi-tr181

---
# Canonical WiFi mappings for TR-181 (Device.*) devices.
#
# WiFi is the first canonical namespace with multi-instance objects, and it
# exposes a property of the resolver worth knowing before editing this file:
# a canonical wildcard (`canonical.wifi.ssid.*.ssid`) is expanded by walking
# the DECLARED entries in this table, not by scanning the device's stored
# parameters. An instance therefore only exists northbound if it is written
# out below. That is why the ranges are enumerated rather than expressed as
# a pattern.
#
# The ranges cover what residential gateways actually expose: 2 radios, 4 SSIDs, 4 access points.
# Operators serving devices with more radios or SSIDs extend this table at a
# higher-priority profile; nothing in Go caps the count.
apiVersion: mapping.herder.io/v1alpha1
kind: MappingTable
metadata:
  name: wifi-tr181
spec:
  mappings:
    - canonical: canonical.wifi.radio.1.enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.1.Enable
    - canonical: canonical.wifi.radio.1.status
      valueType: string
      devicePath: Device.WiFi.Radio.1.Status
    - canonical: canonical.wifi.radio.1.channel
      valueType: unsignedint
      devicePath: Device.WiFi.Radio.1.Channel
    - canonical: canonical.wifi.radio.1.band
      valueType: string
      devicePath: Device.WiFi.Radio.1.OperatingFrequencyBand
    - canonical: canonical.wifi.radio.2.enable
      valueType: boolean
      devicePath: Device.WiFi.Radio.2.Enable
    - canonical: canonical.wifi.radio.2.status
      valueType: string
      devicePath: Device.WiFi.Radio.2.Status
    - canonical: canonical.wifi.radio.2.channel
      valueType: unsignedint
      devicePath: Device.WiFi.Radio.2.Channel
    - canonical: canonical.wifi.radio.2.band
      valueType: string
      devicePath: Device.WiFi.Radio.2.OperatingFrequencyBand
    - canonical: canonical.wifi.ssid.1.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.1.Enable
    - canonical: canonical.wifi.ssid.1.status
      valueType: string
      devicePath: Device.WiFi.SSID.1.Status
    - canonical: canonical.wifi.ssid.1.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.1.SSID
    - canonical: canonical.wifi.ssid.1.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.1.BSSID
    - canonical: canonical.wifi.ssid.2.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.2.Enable
    - canonical: canonical.wifi.ssid.2.status
      valueType: string
      devicePath: Device.WiFi.SSID.2.Status
    - canonical: canonical.wifi.ssid.2.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.2.SSID
    - canonical: canonical.wifi.ssid.2.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.2.BSSID
    - canonical: canonical.wifi.ssid.3.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.3.Enable
    - canonical: canonical.wifi.ssid.3.status
      valueType: string
      devicePath: Device.WiFi.SSID.3.Status
    - canonical: canonical.wifi.ssid.3.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.3.SSID
    - canonical: canonical.wifi.ssid.3.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.3.BSSID
    - canonical: canonical.wifi.ssid.4.enable
      valueType: boolean
      devicePath: Device.WiFi.SSID.4.Enable
    - canonical: canonical.wifi.ssid.4.status
      valueType: string
      devicePath: Device.WiFi.SSID.4.Status
    - canonical: canonical.wifi.ssid.4.ssid
      valueType: string
      devicePath: Device.WiFi.SSID.4.SSID
    - canonical: canonical.wifi.ssid.4.bssid
      valueType: string
      devicePath: Device.WiFi.SSID.4.BSSID
    - canonical: canonical.wifi.ap.1.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.1.Enable
    - canonical: canonical.wifi.ap.1.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.1.Security.ModeEnabled
    - canonical: canonical.wifi.ap.1.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.1.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.2.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.2.Enable
    - canonical: canonical.wifi.ap.2.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.2.Security.ModeEnabled
    - canonical: canonical.wifi.ap.2.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.2.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.3.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.3.Enable
    - canonical: canonical.wifi.ap.3.security_mode
      valueType: string
      devicePath: Device.WiFi.AccessPoint.3.Security.ModeEnabled
    - canonical: canonical.wifi.ap.3.client_count
      valueType: unsignedint
      devicePath: Device.WiFi.AccessPoint.3.AssociatedDeviceNumberOfEntries
    - canonical: canonical.wifi.ap.4.enable
      valueType: boolean
      devicePath: Device.WiFi.AccessPoint.4.Enable
    - canonical: canonical.wifi.ap.4.security_mode
      valueType: string
